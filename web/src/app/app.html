<a class="skip-link" [attr.href]="router.url.split('#')[0] + '#main'">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/workshops" aria-label="SeatSafe home"
    >SeatSafe<span>Workshop reservations</span></a
  >
  <nav aria-label="Main navigation">
    <a routerLink="/workshops" routerLinkActive="active" ariaCurrentWhenActive="page">Workshops</a>
    @if (auth.account(); as account) {
      <p-tag severity="success" [value]="'Signed in as ' + account.displayName" />
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Create account</a
      >
    }
  </nav>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer class="site-footer">SeatSafe. Workshops, made easier.</footer>
